name: EscapeProbe

options:
  deploymentTarget:
    iOS: "18.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO

schemes:
  EscapeProbe:
    build:
      targets:
        EscapeProbe: all
    test:
      config: Debug
      targets: [EscapeProbeUITests]

targets:
  EscapeProbe:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swarajban.florida.diagnostics.escapeprobe
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Escape Probe
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]

  EscapeProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: EscapeProbe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.swarajban.florida.diagnostics.escapeprobe.uitests
