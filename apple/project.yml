name: Florida

options:
  bundleIdPrefix: com.swarajban.florida
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    CODE_SIGN_STYLE: Automatic

packages:
  FloridaCore:
    path: FloridaCore
  FloridaKit:
    path: FloridaKit

schemes:
  Florida-iOS:
    build:
      targets:
        Florida-iOS: all
    run:
      config: Debug
    archive:
      config: Release
  Florida-macOS:
    build:
      targets:
        Florida-macOS: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  Florida-iOS:
    type: application
    platform: iOS
    sources: [iOS]
    dependencies:
      - package: FloridaKit
      - target: FloridaWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swarajban.florida
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Florida
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: iOS/Florida.entitlements
      properties:
        com.apple.security.application-groups: [group.com.swarajban.florida]
        aps-environment: development

  FloridaWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets]
    dependencies:
      - package: FloridaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swarajban.florida.widgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Florida Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/FloridaWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.swarajban.florida]

  Florida-macOS:
    type: application
    platform: macOS
    sources: [macOS]
    dependencies:
      - package: FloridaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swarajban.florida.mac
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Florida
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
    entitlements:
      path: macOS/Florida.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [group.com.swarajban.florida]
