name: Florida

options:
  bundleIdPrefix: com.swarajban.florida
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    CODE_SIGN_STYLE: Automatic
    # CFBundleShortVersionString / CFBundleVersion of every target. The TestFlight workflow
    # overrides CURRENT_PROJECT_VERSION with a monotonic build number.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  FloridaCore:
    path: FloridaCore
  FloridaKit:
    path: FloridaKit

schemes:
  Florida-iOS:
    build:
      targets:
        Florida-iOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [Florida-iOSUITests]
      preferredScreenCaptureFormat: screenRecording
      deleteScreenshotsWhenEachTestSucceeds: false
    archive:
      config: Release
  Florida-macOS:
    build:
      targets:
        Florida-macOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [Florida-macOSUITests]
      preferredScreenCaptureFormat: screenRecording
      deleteScreenshotsWhenEachTestSucceeds: false
    archive:
      config: Release

targets:
  Florida-iOS:
    type: application
    platform: iOS
    sources:
      - iOS
      - Design/FloridaStyle.swift
      - Design/TaskRecurrenceSection.swift
      - Design/Assets.xcassets
    dependencies:
      - package: FloridaKit
      - target: FloridaWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swarajban.florida
        PRODUCT_NAME: Florida
        # iPhone only: iPad would also require every orientation (or UIRequiresFullScreen).
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Florida
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only HTTPS; skips the export-compliance questions on every TestFlight build.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: iOS/Florida.entitlements
      properties:
        com.apple.security.application-groups: [group.com.swarajban.florida]
        # Add `aps-environment: development` here once the server sends silent pushes; the
        # App ID then also needs the Push Notifications capability.

  FloridaWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets]
    dependencies:
      - package: FloridaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swarajban.florida.widgets
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Florida Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/FloridaWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.swarajban.florida]

  Florida-macOS:
    type: application
    platform: macOS
    sources:
      - macOS
      - Design/FloridaStyle.swift
      - Design/TaskRecurrenceSection.swift
      - Design/Assets.xcassets
      - iOS/Support/DemoData.swift
    dependencies:
      - package: FloridaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swarajban.florida.mac
        PRODUCT_NAME: Florida
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Florida
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
    entitlements:
      path: macOS/Florida.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [group.com.swarajban.florida]

  Florida-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [iOSUITests]
    dependencies:
      - target: Florida-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.swarajban.florida.uitests
        TARGETED_DEVICE_FAMILY: "1"

  Florida-macOSUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [macOSUITests]
    dependencies:
      - target: Florida-macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.swarajban.florida.mac.uitests
