# fly.toml for the Florida API server. Build context is this directory (the repo root).
app = "florida-swaraj"
primary_region = "lax"

[build]
  dockerfile = "server/Dockerfile"

[deploy]
  release_command = "node server/dist/migrate.js"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
