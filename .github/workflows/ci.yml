name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Apple paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      apple: ${{ steps.paths.outputs.apple }}
    steps:
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            apple:
              - 'apple/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ios.yml'
              - '.github/workflows/macos.yml'
              - '.github/workflows/apple-checks.yml'
              - '.github/workflows/ios-upload.yml'
              - '.github/workflows/macos-upload.yml'
              - '.github/workflows/apple-release-policy.yml'

  typescript:
    name: Scheduler + server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  swift-linux:
    name: FloridaCore + FloridaKit (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4-bookworm
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - run: swift build --build-tests
        working-directory: apple/FloridaCore
      - run: swift test
        working-directory: apple/FloridaCore
      - run: swift build --build-tests
        working-directory: apple/FloridaKit
      - run: swift test
        working-directory: apple/FloridaKit
      - run: apt-get update && apt-get install -y python3
      - run: python3 apple/scripts/test-app-writes.py

  apple:
    name: Apple apps (Xcode)
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    uses: ./.github/workflows/apple-checks.yml
    with:
      run_ui: false
