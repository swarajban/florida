name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: Scheduler + server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  swift-linux:
    name: FloridaCore + FloridaKit (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4-bookworm
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - run: swift build --build-tests
        working-directory: apple/FloridaCore
      - run: swift test
        working-directory: apple/FloridaCore
      - run: swift build --build-tests
        working-directory: apple/FloridaKit
      - run: swift test
        working-directory: apple/FloridaKit

  apple:
    name: Apple apps (Xcode)
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodebuild -version
      - run: xcodegen generate
        working-directory: apple
        env:
          DEVELOPMENT_TEAM: ""
      # The iOS app and widgets are built (and shipped) by ios.yml.
      - name: Build Florida-macOS
        run: |
          set -o pipefail
          xcodebuild build \
            -project Florida.xcodeproj \
            -scheme Florida-macOS \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | xcbeautify --renderer github-actions
        working-directory: apple
      - name: macOS UI smoke test and screenshots
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild test \
            -project Florida.xcodeproj \
            -scheme Florida-macOS \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -resultBundlePath mac-ui.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            | xcbeautify --renderer github-actions
      - name: Export macOS screenshots
        if: always()
        working-directory: apple
        run: |
          if [ -d mac-ui.xcresult ]; then
            xcrun xcresulttool export attachments --path mac-ui.xcresult --output-path mac-screenshots
          fi
      - name: Upload macOS screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-screenshots
          path: apple/mac-screenshots/
          if-no-files-found: ignore
      - name: FloridaCore tests (macOS)
        run: swift test
        working-directory: apple/FloridaCore
      - name: FloridaKit tests (macOS)
        run: swift test
        working-directory: apple/FloridaKit
