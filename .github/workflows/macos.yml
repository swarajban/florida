name: macOS TestFlight

# PR pushes compile only; full UI suites are requested explicitly before merge.
# Main's UI result is independent of uploads while APPLE_UI_GATE is off.
on:
  push:
    branches: [main]
    paths:
      - "apple/**"
      - ".github/workflows/macos.yml"
      - ".github/workflows/macos-upload.yml"
      - ".github/workflows/apple-release-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/apple-release-policy.yml

  testflight:
    name: Upload to TestFlight
    needs: policy
    if: github.ref == 'refs/heads/main' && needs.policy.outputs.ui_gate != 'true'
    uses: ./.github/workflows/macos-upload.yml
    secrets: inherit

  gated-testflight:
    name: Upload to TestFlight (UI gate enabled)
    needs: [policy, ui]
    if: github.ref == 'refs/heads/main' && needs.policy.outputs.ui_gate == 'true'
    uses: ./.github/workflows/macos-upload.yml
    secrets: inherit

  ui:
    name: macOS UI suite
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Generate Xcode project
        working-directory: apple
        env:
          DEVELOPMENT_TEAM: ""
        run: |
          brew install xcodegen
          xcodegen generate

      - name: macOS UI smoke test
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild test \
            -project Florida.xcodeproj \
            -scheme Florida-macOS \
            -configuration Debug \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 2 \
            -derivedDataPath build \
            -resultBundlePath mac-ui.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            | tee mac-ui-test.log | xcbeautify --renderer github-actions

      - name: Report retried UI failures
        if: always()
        run: bash apple/scripts/report-ui-failures.sh apple/mac-ui-test.log

      - name: Upload UI results and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-ui-results
          path: |
            apple/mac-ui.xcresult/
            apple/mac-ui-test.log
          retention-days: 7
          if-no-files-found: ignore
