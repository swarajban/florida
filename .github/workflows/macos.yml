name: macOS TestFlight

# The general CI workflow still builds and tests pull requests without release credentials.
# This workflow tests again before uploading main, independently of the iOS release.
on:
  push:
    branches: [main]
    paths:
      - "apple/**"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-testflight
  # Never cancel a run that may already be uploading to App Store Connect.
  cancel-in-progress: false

env:
  # Match iOS so native Mac builds appear under the existing Florida Tasks app.
  BUNDLE_ID: com.swarajban.florida
  APP_GROUP: group.com.swarajban.florida

jobs:
  testflight:
    name: Test and upload to TestFlight
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '8G7N7547R6' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing — see apple/README.md"
            exit 1
          fi

      - name: Install App Store Connect API key
        run: |
          umask 077
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          # Save the path first so cleanup also runs if decoding fails.
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY_PATH"
          fi

      - name: Verify shared app record
        run: |
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/asc-venv/bin/python" - <<'PY'
          import json, os, sys, time, urllib.error, urllib.parse, urllib.request
          import jwt
          with open(os.environ["KEY_PATH"]) as f:
              pem = f.read()
          token = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()),
               "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
              pem, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          bundle = os.environ["BUNDLE_ID"]
          query = urllib.parse.urlencode({"filter[bundleId]": bundle})
          request = urllib.request.Request(
              f"https://api.appstoreconnect.apple.com/v1/apps?{query}",
              headers={"Authorization": f"Bearer {token}"})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  apps = json.load(response)["data"]
          except urllib.error.HTTPError as error:
              print(f"::error::App Store Connect rejected the request: HTTP {error.code}")
              sys.exit(1)
          if not apps:
              print(f"::error::No accessible App Store Connect app uses {bundle}. Check the existing iOS app's bundle ID and this key's access. See apple/README.md.")
              sys.exit(1)
          print(f"Found shared app '{apps[0]['attributes']['name']}' for {bundle}.")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"APP_ID={apps[0]['id']}\n")
          PY

      - name: Generate Xcode project
        working-directory: apple
        env:
          DEVELOPMENT_TEAM: ${{ env.TEAM_ID }}
        run: |
          brew install xcodegen
          xcodegen generate

      - name: macOS UI smoke test
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild test \
            -project Florida.xcodeproj \
            -scheme Florida-macOS \
            -configuration Debug \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 2 \
            -derivedDataPath build \
            -resultBundlePath mac-ui.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            | tee mac-ui-test.log | xcbeautify --renderer github-actions

      - name: Report retried UI failures
        if: always()
        run: bash apple/scripts/report-ui-failures.sh apple/mac-ui-test.log

      - name: Upload UI results and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-ui-results
          path: |
            apple/mac-ui.xcresult/
            apple/mac-ui-test.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Archive for Apple silicon and Intel
        working-directory: apple
        run: |
          set -o pipefail
          BUILD_NUMBER=$(( GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT ))
          echo "Build number: $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          # As on iOS, archive without a local development certificate. Export cloud-signs it.
          xcodebuild archive \
            -project Florida.xcodeproj \
            -scheme Florida-macOS \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Florida-macOS.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee mac-archive.log | xcbeautify --renderer github-actions

      - name: Seal and verify archive entitlements
        working-directory: apple
        run: |
          APP="$RUNNER_TEMP/Florida-macOS.xcarchive/Products/Applications/Florida.app"
          lipo "$APP/Contents/MacOS/Florida" -verify_arch arm64 x86_64
          # Export preserves entitlements from the signature, not the source .entitlements.
          # macOS TestFlight also requires an application identifier and provisioning profile.
          ENTITLEMENTS="$RUNNER_TEMP/mac-entitlements.plist"
          cp macOS/Florida.entitlements "$ENTITLEMENTS"
          /usr/libexec/PlistBuddy -c "Add :com.apple.application-identifier string $TEAM_ID.$BUNDLE_ID" "$ENTITLEMENTS"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string $TEAM_ID" "$ENTITLEMENTS"
          for nested in "$APP"/Contents/Frameworks/*; do
            [ -e "$nested" ] || continue
            codesign --force --sign - "$nested"
          done
          codesign --force --sign - --entitlements "$ENTITLEMENTS" "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -d --entitlements - --xml "$APP" > "$RUNNER_TEMP/sealed-entitlements.plist"
          python3 - "$RUNNER_TEMP/sealed-entitlements.plist" <<'PY'
          import os, plistlib, sys
          with open(sys.argv[1], "rb") as f:
              entitlements = plistlib.load(f)
          required = {
              "com.apple.security.app-sandbox": True,
              "com.apple.security.network.client": True,
              "com.apple.application-identifier": f"{os.environ['TEAM_ID']}.{os.environ['BUNDLE_ID']}",
              "com.apple.developer.team-identifier": os.environ["TEAM_ID"],
          }
          missing = [key for key, value in required.items() if entitlements.get(key) != value]
          if os.environ["APP_GROUP"] not in entitlements.get("com.apple.security.application-groups", []):
              missing.append("com.apple.security.application-groups")
          if missing:
              print(f"::error::Incorrect archive entitlements: {', '.join(missing)}")
              sys.exit(1)
          print("Archive preserves the sandbox, network access, App Group, and application identity.")
          PY

      - name: Export and upload to TestFlight
        working-directory: apple
        run: |
          set -o pipefail
          plutil -insert teamID -string "$TEAM_ID" ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Florida-macOS.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/mac-export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee mac-export.log

      - name: Wait for TestFlight processing
        timeout-minutes: 21
        run: |
          "$RUNNER_TEMP/asc-venv/bin/python" -u - <<'PY'
          import json, os, sys, time, urllib.error, urllib.parse, urllib.request
          import jwt
          with open(os.environ["KEY_PATH"]) as f:
              pem = f.read()
          app, build = os.environ["APP_ID"], os.environ["BUILD_NUMBER"]
          query = urllib.parse.urlencode({
              "filter[app]": app, "filter[version]": build,
              "filter[preReleaseVersion.platform]": "MAC_OS", "include": "buildBetaDetail",
          })
          for attempt in range(40):
              now = int(time.time())
              token = jwt.encode(
                  {"iss": os.environ["ASC_ISSUER_ID"], "iat": now,
                   "exp": now + 600, "aud": "appstoreconnect-v1"},
                  pem, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
              request = urllib.request.Request(
                  f"https://api.appstoreconnect.apple.com/v1/builds?{query}",
                  headers={"Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code != 429 and error.code < 500:
                      raise
                  print(f"Apple returned HTTP {error.code}; retrying.")
              else:
                  builds = result["data"]
                  state = builds[0]["attributes"]["processingState"] if builds else "NOT_VISIBLE_YET"
                  print(f"Mac build {build}: {state}")
                  if state in ("FAILED", "INVALID"):
                      sys.exit(f"::error::Apple rejected Mac build {build}. Check App Store Connect and the processing email.")
                  if state == "VALID":
                      detail = builds[0].get("relationships", {}).get("buildBetaDetail", {}).get("data")
                      internal = next((item["attributes"]["internalBuildState"]
                                       for item in result.get("included", [])
                                       if detail and item["type"] == "buildBetaDetails" and item["id"] == detail["id"]), "UNKNOWN")
                      print(f"Internal TestFlight state: {internal}")
                      url = f"https://appstoreconnect.apple.com/apps/{app}/testflight/macos"
                      with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                          f.write(f"## Mac TestFlight build {build}\n\nApple processing: **VALID**.\n\n")
                          f.write(f"Internal testing: **{internal}**. [Open TestFlight]({url}).\n")
                          if internal != "IN_BETA_TESTING":
                              f.write("\nCheck the build's availability to your internal testing group before installing.\n")
                      break
              time.sleep(30)
          else:
              sys.exit(f"::error::Mac build {build} has not finished processing after 20 minutes. Check App Store Connect before uploading another build.")
          PY

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-testflight-logs
          path: |
            apple/mac-*.log
            apple/mac-ui.xcresult/
          if-no-files-found: ignore

      - name: Clean up key
        if: always()
        run: rm -f "$KEY_PATH"
