name: iOS

on:
  workflow_dispatch:
    inputs:
      ui_only:
        description: Run the approved native diagnostics only
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: inbox-native-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac_diagnostic:
    name: Focused Mac G diagnostics
    if: github.event_name == 'workflow_dispatch' && inputs.ui_only == true && github.ref == 'refs/heads/capy/inbox-native-trace'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      RETRY_FAILED_TESTS: '0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
      - name: Verify exact source
        timeout-minutes: 1
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git log -1 --format='%H %s'
      - run: brew install xcodegen
        timeout-minutes: 2
      - name: Run both unchanged G regressions
        timeout-minutes: 36
        run: |
          set -o pipefail
          bash apple/scripts/check.sh macos \
            -only-testing:Florida-macOSUITests/SmokeTests/testJumpLabelsInBothAppearances \
            -only-testing:Florida-macOSUITests/TaskGroupingTests/testTaskGroupingAndKeyboardOrderInBothAppearances \
            2>&1 | tee apple/diagnostic-macos.log
      - name: Retain key selection and scroll traces
        if: always()
        timeout-minutes: 1
        run: |
          /usr/bin/log show --style compact --last 1h \
            --predicate 'eventMessage CONTAINS "INBOX_UI_TRACE"' \
            > apple/diagnostic-macos-trace.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 2
        with:
          name: inbox-native-macos
          path: |
            apple/build/results/
            apple/diagnostic-*.log
          retention-days: 7
          if-no-files-found: ignore

  iphone_diagnostic:
    name: Focused iPhone Someday diagnostics
    if: github.event_name == 'workflow_dispatch' && inputs.ui_only == true && github.ref == 'refs/heads/capy/inbox-native-trace'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      RETRY_FAILED_TESTS: '0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
      - name: Verify exact source
        timeout-minutes: 1
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git log -1 --format='%H %s'
      - run: brew install xcodegen
        timeout-minutes: 2
      - name: Select the same simulator for tests and logs
        timeout-minutes: 1
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS-" in k), key=lambda k: [int(p) for p in k.split("iOS-")[-1].split("-")])
          phones = [d for d in devices[ios[-1]] if d["name"].startswith("iPhone")]
          pro = [d for d in phones if "Pro" in d["name"] and "Max" not in d["name"]]
          print((pro or phones)[0]["udid"])
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: Run switch missing coverage capture and Details regressions
        timeout-minutes: 36
        run: |
          set -o pipefail
          set +e
          bash apple/scripts/check.sh ios \
            -only-testing:Florida-iOSUITests/InboxTriageTests/testSomedayStillRequiresCategoryAndEditorCanResetDecision \
            -only-testing:Florida-iOSUITests/InboxTriageTests/testSomedaySuppressesStalePlacementAndUnscheduledWarning \
            -only-testing:Florida-iOSUITests/InboxTriageTests/testSomedayToggleClearsDueAndPinButKeepsStart \
            -only-testing:Florida-iOSUITests/TaskGroupingTests/testInboxTriageUndoAndFinalSomedayIntentPreserveSource \
            2>&1 | tee apple/diagnostic-iphone-coverage.log
          coverage_status=${PIPESTATUS[0]}
          bash apple/scripts/check.sh ios \
            -only-testing:Florida-iOSUITests/InboxTriageTests/testActualDateActionsLeaveSomeday \
            -only-testing:Florida-iOSUITests/InboxTriageTests/testExplicitSomedayCaptureRequiresCategory \
            2>&1 | tee apple/diagnostic-iphone-faults.log
          faults_status=${PIPESTATUS[0]}
          if (( coverage_status != 0 )); then exit "$coverage_status"; fi
          exit "$faults_status"
      - name: Retain setters first responders and active animations
        if: always()
        timeout-minutes: 1
        run: |
          if [[ -n "${UDID:-}" ]]; then
            xcrun simctl spawn "$UDID" log show --style compact --last 1h \
              --predicate 'eventMessage CONTAINS "INBOX_UI_TRACE"' \
              > apple/diagnostic-iphone-trace.log 2>&1 || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 2
        with:
          name: inbox-native-iphone
          path: |
            apple/build/results/
            apple/diagnostic-*.log
          retention-days: 7
          if-no-files-found: ignore
