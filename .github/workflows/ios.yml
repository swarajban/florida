name: iOS

on:
  workflow_dispatch:
    inputs:
      ui_only:
        description: Compare the two event methods on the PR and main without releases
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: inbox-paired-event-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  iphone:
    name: Paired PR and main event repetitions
    if: github.event_name == 'workflow_dispatch' && inputs.ui_only == true && github.ref == 'refs/heads/capy/inbox-event-paired-cbb'
    runs-on: macos-26
    timeout-minutes: 140
    env:
      RETRY_FAILED_TESTS: '0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 2
        with:
          ref: cbbd590b60ddee1533489d9a5cce1d496d049e11
          path: candidate
      - uses: actions/checkout@v5
        timeout-minutes: 2
        with:
          ref: 9b0c29a1611d25ff3d9daf0a7900ae566e37f1b2
          path: baseline
      - run: brew install xcodegen
        timeout-minutes: 2
      - uses: actions/download-artifact@v4
        timeout-minutes: 3
        with:
          name: apple-test-products
          run-id: 43558259217
          github-token: ${{ github.token }}
          path: candidate-products
      - name: Verify exact sources and restore PR test products
        timeout-minutes: 1
        run: |
          mkdir -p evidence candidate/apple/build
          test "$(git -C candidate rev-parse HEAD)" = cbbd590b60ddee1533489d9a5cce1d496d049e11
          test "$(git -C baseline rev-parse HEAD)" = 9b0c29a1611d25ff3d9daf0a7900ae566e37f1b2
          test -z "$(git -C candidate status --porcelain)"
          test -z "$(git -C baseline status --porcelain)"
          git -C candidate rev-parse HEAD > evidence/PR-tested-head.txt
          git -C baseline rev-parse HEAD > evidence/main-tested-head.txt
          tar -xzf candidate-products/apple-tests.tgz -C candidate/apple/build
          diff candidate/apple/build/xcode-version.txt <(xcodebuild -version)
          xcodebuild -version > evidence/xcode-version.txt
      - name: Select and reset the PR simulator
        timeout-minutes: 2
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS-" in k), key=lambda k: [int(p) for p in k.split("iOS-")[-1].split("-")])
          phones = [d for d in devices[ios[-1]] if d["name"].startswith("iPhone")]
          pro = [d for d in phones if "Pro" in d["name"] and "Max" not in d["name"]]
          print((pro or phones)[0]["udid"])
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "$UDID" > evidence/simulator.txt
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl erase "$UDID"
      - name: Run both PR methods for three fixed iterations
        id: candidate
        continue-on-error: true
        timeout-minutes: 50
        working-directory: candidate
        env:
          TEST_WITHOUT_BUILDING: '1'
        run: |
          set -o pipefail
          date -u +%FT%TZ > ../evidence/PR-start.txt
          bash apple/scripts/check.sh ios -test-iterations 3 \
            -only-testing:Florida-iOSUITests/EventQuickAddTests/testPreviewCorrectionAndLocalSave \
            -only-testing:Florida-iOSUITests/SmokeTests/testTaskShortcutAndRecurringEvent \
            2>&1 | tee ../evidence/PR-ui-test.log
      - name: Reset the same simulator before main
        id: reset_main
        if: always()
        timeout-minutes: 2
        run: |
          test -n "$UDID"
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl erase "$UDID"
      - name: Build and run both main methods for three fixed iterations
        id: baseline
        if: always() && steps.reset_main.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 65
        working-directory: baseline
        run: |
          set -o pipefail
          date -u +%FT%TZ > ../evidence/main-start.txt
          bash apple/scripts/check.sh ios -test-iterations 3 \
            -only-testing:Florida-iOSUITests/EventQuickAddTests/testPreviewCorrectionAndLocalSave \
            -only-testing:Florida-iOSUITests/SmokeTests/testTaskShortcutAndRecurringEvent \
            2>&1 | tee ../evidence/main-ui-test.log
      - name: Record both outcomes
        if: always()
        timeout-minutes: 1
        env:
          PR_OUTCOME: ${{ steps.candidate.outcome }}
          MAIN_OUTCOME: ${{ steps.baseline.outcome }}
        run: |
          mkdir -p evidence
          printf 'PR=%s\nmain=%s\n' "$PR_OUTCOME" "$MAIN_OUTCOME" > evidence/outcomes.txt
      - name: Validate three completed iterations of each exact method per head
        id: coverage
        if: always()
        timeout-minutes: 1
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          expected = {
              'EventQuickAddTests/testPreviewCorrectionAndLocalSave',
              'SmokeTests/testTaskShortcutAndRecurringEvent',
          }
          start = re.compile(r"Test Case '-\[Florida_iOSUITests\.(\w+) (\w+)\]' started \(Iteration (\d+) of (\d+)\)\.")
          finish = re.compile(r"Test Case '-\[Florida_iOSUITests\.(\w+) (\w+)\]' (passed|failed) \(([\d.]+) seconds\)\.")
          errors = []
          result = {}
          for head in ['PR', 'main']:
              path = pathlib.Path('evidence') / (head + '-ui-test.log')
              text = path.read_text(errors='replace') if path.exists() else ''
              starts = start.findall(text)
              finishes = finish.findall(text)
              result[head] = {}
              if len(starts) != 6 or len(finishes) != 6:
                  errors.append(head + ': expected six started and six completed method iterations')
              for method in sorted(expected):
                  begun = [(int(i), int(total)) for cls, name, i, total in starts if cls + '/' + name == method]
                  done = [{'result': state, 'seconds': float(seconds)} for cls, name, state, seconds in finishes if cls + '/' + name == method]
                  result[head][method] = {'started': begun, 'completed': done}
                  if begun != [(1, 3), (2, 3), (3, 3)] or len(done) != 3:
                      errors.append(head + ': incomplete fixed repetitions for ' + method)
          pathlib.Path('evidence/repetition-validation.json').write_text(json.dumps({'results': result, 'errors': errors}, indent=2))
          print(json.dumps({'results': result, 'errors': errors}, indent=2))
          sys.exit(bool(errors))
          PY
      - name: Upload logs and native failure frames
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: inbox-paired-event-evidence
          path: |
            evidence/
            candidate/apple/build/results/
            baseline/apple/build/results/
          retention-days: 7
          if-no-files-found: error
      - name: Preserve failure status
        if: always()
        timeout-minutes: 1
        env:
          PR_OUTCOME: ${{ steps.candidate.outcome }}
          MAIN_OUTCOME: ${{ steps.baseline.outcome }}
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
        run: test "$COVERAGE_OUTCOME" = success && test "$PR_OUTCOME" = success && test "$MAIN_OUTCOME" = success
