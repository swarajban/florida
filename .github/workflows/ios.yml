name: iOS

# build:      runs the full simulator suite on main, independently of uploads by default.
# ui:         explicit ui_only dispatch runs both PR UI suites without release credentials.
# testflight: archives, signs and uploads to TestFlight on pushes to main and on manual runs.
#             Needs the App Store Connect secrets described in apple/README.md.
on:
  push:
    branches: [main]
    paths:
      - "apple/**"
      - ".github/workflows/ios.yml"
      - ".github/workflows/ios-upload.yml"
      - ".github/workflows/apple-release-policy.yml"
  workflow_dispatch:
    inputs:
      ui_only:
        description: Run both PR UI suites only (never upload)
        type: boolean
        default: false

concurrency:
  group: ${{ inputs.ui_only && format('apple-ui-{0}', github.ref) || format('ios-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ inputs.ui_only }}

jobs:
  policy:
    if: inputs.ui_only != true
    uses: ./.github/workflows/apple-release-policy.yml

  ui:
    name: On-demand Apple UI
    if: github.event_name == 'workflow_dispatch' && inputs.ui_only
    uses: ./.github/workflows/apple-checks.yml
    with:
      run_ui: true

  build:
    name: iPhone UI suite
    if: inputs.ui_only != true
    runs-on: macos-26
    # Cold simulator boot plus the full light/dark capture suite can exceed 30 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Generate Xcode project
        working-directory: apple
        env:
          DEVELOPMENT_TEAM: ""
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          ios = sorted((k for k in devices if 'iOS' in k), key=lambda k: [int(p) for p in k.split('iOS-')[-1].split('-')])
          phones = [d for d in devices[ios[-1]] if d['name'].startswith('iPhone') and 'Pro' in d['name'] and 'Max' not in d['name']] or [d for d in devices[ios[-1]] if d['name'].startswith('iPhone')]
          print(phones[0]['udid'])
          ")
          echo "Using simulator $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild build \
            -project Florida.xcodeproj \
            -scheme Florida-iOS \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee build.log | xcbeautify --renderer github-actions

      - name: UI smoke test and screenshots
        working-directory: apple
        run: |
          set -o pipefail
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          # The tests wait for visible demo content, exercise the real tab controls, then
          # capture light/dark screens and large text. No personal data or server is involved.
          xcodebuild test \
            -project Florida.xcodeproj \
            -scheme Florida-iOS \
            -configuration Debug \
            -destination "id=$UDID" \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 2 \
            -derivedDataPath build \
            -resultBundlePath ios-ui.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee ui-test.log | xcbeautify --renderer github-actions

      - name: Report retried UI failures
        if: always()
        run: bash apple/scripts/report-ui-failures.sh apple/ui-test.log

      - name: Upload UI results and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ui-results
          path: |
            apple/ios-ui.xcresult/
            apple/ui-test.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Export screenshots
        if: always()
        working-directory: apple
        run: |
          if [ -d ios-ui.xcresult ]; then
            xcrun xcresulttool export attachments --path ios-ui.xcresult --output-path screenshots
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: apple/screenshots/
          if-no-files-found: ignore

      - name: Upload build log on failure or cancellation
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: apple/*.log
          if-no-files-found: ignore

  testflight:
    name: Upload to TestFlight
    needs: policy
    if: needs.policy.outputs.ui_gate != 'true' && (inputs.ui_only != true && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')))
    uses: ./.github/workflows/ios-upload.yml
    secrets: inherit

  gated-testflight:
    name: Upload to TestFlight (UI gate enabled)
    needs: [policy, build]
    if: needs.policy.outputs.ui_gate == 'true' && (inputs.ui_only != true && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')))
    uses: ./.github/workflows/ios-upload.yml
    secrets: inherit
