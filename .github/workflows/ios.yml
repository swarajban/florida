name: iOS

# build:      runs the essential plan only when the release UI gate is enabled.
# ui:         explicit UI dispatches run without release credentials.
# testflight: archives, signs and uploads to TestFlight on pushes to main and on manual runs.
#             Needs the App Store Connect secrets described in apple/README.md.
on:
  push:
    branches: [main]
    paths:
      - "apple/**"
      - ".github/workflows/ios.yml"
      - ".github/workflows/ios-upload.yml"
      - ".github/workflows/apple-release-policy.yml"
  workflow_dispatch:
    inputs:
      ui_only:
        description: Run the full UI suites or the supplied selectors (never upload)
        type: boolean
        default: false
      essential_tests:
        description: Run both default essential test plans (never upload)
        type: boolean
        default: false
      mac_test_selector:
        description: Optional space-separated Mac test bundles, classes or methods for one focused UI-only job
        type: string
        default: ''
      iphone_test_selector:
        description: Optional space-separated iPhone test bundles, classes or methods for one focused UI-only job
        type: string
        default: ''

concurrency:
  group: ${{ (inputs.ui_only || inputs.essential_tests) && format('apple-ui-{0}', github.ref) || format('ios-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ inputs.ui_only == true || inputs.essential_tests == true }}

permissions:
  contents: read
  actions: read

jobs:
  policy:
    if: inputs.ui_only != true && inputs.essential_tests != true
    uses: ./.github/workflows/apple-release-policy.yml

  ui:
    name: On-demand Apple UI
    if: github.event_name == 'workflow_dispatch' && inputs.ui_only && !inputs.essential_tests && inputs.mac_test_selector == '' && inputs.iphone_test_selector == ''
    uses: ./.github/workflows/apple-checks.yml
    with:
      run_ui: true

  essential:
    name: Essential tests (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' && inputs.essential_tests
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    env:
      ESSENTIAL_TESTS: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - name: Test the scheme default without retries
        run: |
          set -o pipefail
          bash apple/scripts/check.sh ${{ matrix.platform }} 2>&1 | tee apple/essential-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essential-test-results-${{ matrix.platform }}
          path: |
            apple/build/results/
            apple/essential-test.log
          retention-days: 7

  mac_focused:
    name: Focused Mac tests
    if: github.event_name == 'workflow_dispatch' && inputs.ui_only && !inputs.essential_tests && inputs.mac_test_selector != ''
    runs-on: macos-26
    timeout-minutes: 60
    env:
      RETRY_FAILED_TESTS: '0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v5
      - name: Validate test selector
        env:
          MAC_TEST_SELECTOR: ${{ inputs.mac_test_selector }}
        run: |
          [[ "$MAC_TEST_SELECTOR" != *$'\n'* && "$MAC_TEST_SELECTOR" != *$'\r'* ]] || exit 2
          read -r -a selectors <<< "$MAC_TEST_SELECTOR"
          (( ${#selectors[@]} > 0 )) || exit 2
          for selector in "${selectors[@]}"; do
            [[ "$selector" =~ ^Florida-macOS(KeyboardTests|UITests)(/[A-Za-z_][A-Za-z0-9_]*){0,2}$ ]] || exit 2
          done
      - run: brew install xcodegen
      - name: Identify toolchain
        id: xcode
        run: echo "version=$(xcodebuild -version | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore SwiftPM downloads
        uses: actions/cache/restore@v4
        with:
          path: apple/build/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/**/Package.resolved', 'apple/**/Package.swift') }}
      - name: Restore derived data
        uses: actions/cache/restore@v4
        with:
          path: |
            apple/build/ios
            apple/build/macos
          key: xcode-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/**/*.swift', 'apple/**/*.yml', 'apple/**/*.plist', 'apple/**/*.entitlements', 'apple/**/*.xctestplan', 'apple/**/Package.resolved', 'apple/Design/Assets.xcassets/**', 'apple/scripts/**') }}
          restore-keys: |
            xcode-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-
      - name: Restore exact-SHA test products or fall back to cached build
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash apple/scripts/restore-test-products.sh macos
      - name: Build and run selected Mac tests
        env:
          MAC_TEST_SELECTOR: ${{ inputs.mac_test_selector }}
        run: |
          set -o pipefail
          read -r -a selectors <<< "$MAC_TEST_SELECTOR"
          bash apple/scripts/check.sh macos "${selectors[@]/#/-only-testing:}" 2>&1 | tee apple/ui-test.log
      - name: Upload focused results and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-macos-focused
          path: |
            apple/build/results/
            apple/ui-test.log
          retention-days: 7
          if-no-files-found: ignore

  iphone_focused:
    name: Focused iPhone tests
    if: github.event_name == 'workflow_dispatch' && inputs.ui_only && !inputs.essential_tests && inputs.iphone_test_selector != ''
    runs-on: macos-26
    timeout-minutes: 60
    env:
      RETRY_FAILED_TESTS: '0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Validate test selector
        env:
          IPHONE_TEST_SELECTOR: ${{ inputs.iphone_test_selector }}
        run: |
          [[ "$IPHONE_TEST_SELECTOR" != *$'\n'* && "$IPHONE_TEST_SELECTOR" != *$'\r'* ]] || exit 2
          read -r -a selectors <<< "$IPHONE_TEST_SELECTOR"
          (( ${#selectors[@]} > 0 )) || exit 2
          for selector in "${selectors[@]}"; do
            [[ "$selector" =~ ^Florida-iOSUITests(/[A-Za-z_][A-Za-z0-9_]*){0,2}$ ]] || exit 2
          done
      - run: brew install xcodegen
        timeout-minutes: 2
      - name: Identify toolchain
        id: xcode
        run: echo "version=$(xcodebuild -version | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore SwiftPM downloads
        uses: actions/cache/restore@v4
        with:
          path: apple/build/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/**/Package.resolved', 'apple/**/Package.swift') }}
      - name: Restore derived data
        uses: actions/cache/restore@v4
        with:
          path: |
            apple/build/ios
            apple/build/macos
          key: xcode-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/**/*.swift', 'apple/**/*.yml', 'apple/**/*.plist', 'apple/**/*.entitlements', 'apple/**/*.xctestplan', 'apple/**/Package.resolved', 'apple/Design/Assets.xcassets/**', 'apple/scripts/**') }}
          restore-keys: |
            xcode-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-
      - name: Restore exact-SHA test products or fall back to cached build
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash apple/scripts/restore-test-products.sh ios
      - name: Build and run selected iPhone tests
        timeout-minutes: 55
        env:
          IPHONE_TEST_SELECTOR: ${{ inputs.iphone_test_selector }}
        run: |
          set -o pipefail
          read -r -a selectors <<< "$IPHONE_TEST_SELECTOR"
          bash apple/scripts/check.sh ios "${selectors[@]/#/-only-testing:}" 2>&1 | tee apple/ui-test.log
      - name: Upload focused results and log
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: ui-iphone-focused
          path: |
            apple/build/results/
            apple/ui-test.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Export focused iPhone screenshots
        if: always()
        run: |
          for result in apple/build/results/*.xcresult; do
            [ -d "$result" ] || continue
            xcrun xcresulttool export attachments --path "$result" --output-path apple/build/focused-screenshots
          done
      - name: Upload focused iPhone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-focused-screenshots
          path: apple/build/focused-screenshots
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: iPhone essential release tests
    needs: policy
    if: inputs.ui_only != true && needs.policy.outputs.ui_gate == 'true'
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Generate Xcode project
        working-directory: apple
        env:
          DEVELOPMENT_TEAM: ""
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick simulator
        run: |
          UDID=$(bash apple/scripts/pick-iphone.sh)
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild build \
            -project Florida.xcodeproj \
            -scheme Florida-iOS \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee build.log | xcbeautify --renderer github-actions

      - name: UI smoke test and screenshots
        working-directory: apple
        run: |
          set -o pipefail
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          xcodebuild test \
            -project Florida.xcodeproj \
            -scheme Florida-iOS \
            -configuration Debug \
            -destination "id=$UDID" \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 2 \
            -derivedDataPath build \
            -resultBundlePath ios-ui.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee ui-test.log | xcbeautify --renderer github-actions

      - name: Report retried UI failures
        if: always()
        run: bash apple/scripts/report-ui-failures.sh apple/ui-test.log

      - name: Upload UI results and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ui-results
          path: |
            apple/ios-ui.xcresult/
            apple/ui-test.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Export screenshots
        if: always()
        working-directory: apple
        run: |
          if [ -d ios-ui.xcresult ]; then
            xcrun xcresulttool export attachments --path ios-ui.xcresult --output-path screenshots
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: apple/screenshots/
          if-no-files-found: ignore

      - name: Upload build log on failure or cancellation
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: apple/*.log
          if-no-files-found: ignore

  testflight:
    name: Upload to TestFlight
    needs: policy
    if: needs.policy.outputs.ui_gate != 'true' && inputs.ui_only != true && inputs.essential_tests != true && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    uses: ./.github/workflows/ios-upload.yml
    secrets: inherit

  gated-testflight:
    name: Upload to TestFlight (UI gate enabled)
    needs: [policy, build]
    if: needs.policy.outputs.ui_gate == 'true' && inputs.ui_only != true && inputs.essential_tests != true && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    uses: ./.github/workflows/ios-upload.yml
    secrets: inherit
