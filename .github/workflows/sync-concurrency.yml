name: Sync concurrency

on:
  pull_request:
    paths:
      - 'server/**'
      - 'packages/scheduler/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/sync-concurrency.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'packages/scheduler/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/sync-concurrency.yml'

permissions:
  contents: read

jobs:
  postgres:
    name: Real Postgres cursor regressions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: florida_sync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @florida/server exec vitest run test/sync-concurrency.test.ts
        env:
          TEST_DATABASE_URL: postgres://postgres:local-test-only@localhost:5432/florida_sync
