name: iOS upload

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      export_only:
        description: Verify branch signing only, with no TestFlight upload
        type: boolean
        required: true
        default: true

permissions:
  contents: read

env:
  BUNDLE_ID: com.swarajban.florida

jobs:
  testflight:
    name: ${{ github.workflow == 'iOS upload' && github.event_name == 'workflow_dispatch' && 'Verify signing (no upload)' || 'Upload to TestFlight' }}
    runs-on: macos-26
    concurrency:
      group: ios-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      # Not secret (it is in every signed app). The default is the team virtus ships under.
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '8G7N7547R6' }}
      EXPORT_ONLY: ${{ github.workflow == 'iOS upload' && github.event_name == 'workflow_dispatch' && inputs.export_only }}
    steps:
      - uses: actions/checkout@v5

      - name: Require export-only manual runs
        if: github.workflow == 'iOS upload' && github.event_name == 'workflow_dispatch'
        run: test "$EXPORT_ONLY" = true

      - name: Check secrets
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing — see apple/README.md"
            exit 1
          fi

      - name: Install App Store Connect API key
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          # Accept the .p8 either pasted as-is or base64-encoded.
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY_PATH"
          fi
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: apple
        env:
          DEVELOPMENT_TEAM: ${{ env.TEAM_ID }}
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Verify App Store Connect API key
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error
          import jwt
          key_id, issuer = os.environ["ASC_KEY_ID"].strip(), os.environ["ASC_ISSUER_ID"].strip()
          pem = open(os.environ["KEY_PATH"]).read()
          print(f"Key ID length {len(key_id)} (expect 10), issuer length {len(issuer)} (expect 36, a UUID)")
          print(f"p8 has BEGIN line: {'BEGIN PRIVATE KEY' in pem}, END line: {'END PRIVATE KEY' in pem}, {len(pem)} chars")
          try:
              token = jwt.encode({"iss": issuer, "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                                 pem, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"})
          except Exception as e:
              print(f"::error::Could not load the .p8 private key: {e}"); sys.exit(1)
          bundle = os.environ["BUNDLE_ID"]
          req = urllib.request.Request(f"https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]={bundle}",
                                       headers={"Authorization": f"Bearer {token}"})
          try:
              data = json.load(urllib.request.urlopen(req))
          except urllib.error.HTTPError as e:
              print(f"::error::App Store Connect rejected the key: HTTP {e.code} {e.read().decode()[:500]}"); sys.exit(1)
          apps = data.get("data", [])
          if not apps:
              print(f"::error::Key works, but no App Store Connect app uses bundle ID {bundle}. Create it under Apps > New App."); sys.exit(1)
          print(f"Key OK. Found app '{apps[0]['attributes']['name']}' for {bundle}.")
          PY

      - name: Archive
        working-directory: apple
        run: |
          set -o pipefail
          # Archive unsigned: the export step signs with Apple's cloud-managed distribution
          # certificate, so no development profile (which would need a registered device) or
          # local certificate is ever created. The next step seals the entitlements in, which
          # an unsigned archive would otherwise lose. The bundle ids stay as project.yml sets
          # them: the app and its extensions need different ones, so no command-line
          # override. Monotonic build number; run_attempt keeps re-runs unique.
          if [ "$EXPORT_ONLY" = true ]; then
            BUILD_NUMBER=1
          else
            BUILD_NUMBER=$(( GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT ))
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Build number: $BUILD_NUMBER"
          xcodebuild archive \
            -project Florida.xcodeproj \
            -scheme Florida-iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Florida.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee archive.log | xcbeautify --renderer github-actions

      - name: Seal entitlements into the archive
        working-directory: apple
        run: |
          # -exportArchive keeps only the entitlements it finds in an existing code signature.
          # A bundle left unsigned by the archive is re-signed with the profile's defaults and
          # silently loses App Groups, so the widgets find no shared container and the app
          # falls back to a private store. An ad-hoc signature with the xcodegen-written
          # entitlements is enough: the export step re-signs everything with the real
          # certificate. Nested code first, then the app.
          APP="$RUNNER_TEMP/Florida.xcarchive/Products/Applications/Florida.app"
          APPEX="$APP/PlugIns/FloridaWidgets.appex"
          SHARE="$APP/PlugIns/FloridaShare.appex"
          for bundle in "$APP" "$APPEX" "$SHARE"; do
            if [ ! -d "$bundle" ]; then
              echo "::error::Expected $bundle in the archive"
              find "$RUNNER_TEMP/Florida.xcarchive/Products" -maxdepth 4 -type d \( -name '*.app' -o -name '*.appex' -o -name '*.framework' \)
              exit 1
            fi
          done
          for nested in "$APP"/Frameworks/*; do
            [ -e "$nested" ] || continue
            codesign --force --sign - "$nested"
          done
          codesign --force --sign - --entitlements Widgets/FloridaWidgets.entitlements "$APPEX"
          codesign --force --sign - --entitlements Share/FloridaShare.entitlements "$SHARE"
          codesign --force --sign - --entitlements iOS/Florida.entitlements "$APP"
          python3 scripts/check-ios-signing.py "$APP"

      - name: Validate signed export before upload
        working-directory: apple
        run: |
          set -o pipefail
          OPTIONS="$RUNNER_TEMP/SigningCheckOptions.plist"
          cp ExportOptions.plist "$OPTIONS"
          plutil -insert teamID -string "$TEAM_ID" "$OPTIONS"
          plutil -replace destination -string export "$OPTIONS"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Florida.xcarchive" \
            -exportOptionsPlist "$OPTIONS" \
            -exportPath "$RUNNER_TEMP/signing-check" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee signing-check.log
          python3 scripts/check-ios-signing.py \
            "$RUNNER_TEMP/Florida.xcarchive/Products/Applications/Florida.app" \
            "$RUNNER_TEMP/signing-check/DistributionSummary.plist"

      - name: Export and upload to TestFlight
        if: env.EXPORT_ONLY != 'true'
        working-directory: apple
        run: |
          set -o pipefail
          plutil -insert teamID -string "$TEAM_ID" ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Florida.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: apple/*.log
          if-no-files-found: ignore

      - name: Clean up key
        if: always()
        run: rm -f "$KEY_PATH"
